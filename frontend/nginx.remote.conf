server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  add_header Access-Control-Allow-Origin * always;

  location ~* ^/remoteEntry\.js$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location ~* \.(js|map)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
