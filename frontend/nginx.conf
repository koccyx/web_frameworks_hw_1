server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Module Federation remotes must return real JS (never SPA fallback).
  location ~* ^/(mf-catalog|mf-matching)/remoteEntry\.js$ {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location = /main.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Don't rewrite JS/source maps to index.html, otherwise federation breaks.
  location ~* \.(js|map)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

